# Fly.io config for the POLLER process only (separate from Vercel frontend)
# Deploy with: fly deploy --config fly-poller.toml
app = 'offshore-poller'
primary_region = 'ams'

[build]

[env]
  NODE_ENV = 'production'

[processes]
  app = 'node server/poller-main.js'

[http_service]
  internal_port        = 8080
  force_https          = false
  auto_stop_machines   = 'off'
  auto_start_machines  = true
  min_machines_running = 1

[[vm]]
  memory    = '512mb'
  cpus      = 1
  memory_mb = 512
